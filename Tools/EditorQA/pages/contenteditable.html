<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="editor" contenteditable="true" style="min-height:200px"></div>
<script>/*QA-COMMON*/</script>
<script>
// Bare contenteditable: browser-native paste/copy (simple web forms, webmails).
const el = document.getElementById('editor');
QAInstall({
  root: () => el,
  setHTML: h => { el.innerHTML = h; },
  getHTML: () => el.innerHTML,
  getText: () => el.innerText,
  clear: () => { el.innerHTML = ''; },
  focusEnd: () => { el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); },
  selectAll: () => { el.focus(); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); },
});
</script></body></html>
